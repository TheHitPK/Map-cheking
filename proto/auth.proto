syntax = "proto3";

package transmcbo.v1;

option java_package = "com.transmcbo.proto";
option java_multiple_files = true;

// POST /auth/chofer
message DriverLogin {
  uint32 veh = 1;
  string pin = 2;
  string line = 3;
}

// Response of POST /auth/chofer and /auth/pasajero: how to connect to MQTT.
message Token {
  string jwt = 1;       // MQTT password (a JWT, or a fixed password when the broker has no JWT auth)
  uint32 exp = 2;       // epoch seconds; renew before this time
  string username = 3;  // MQTT username; empty = client's choice
  string mqtt_host = 4; // empty = app's built-in default
  uint32 mqtt_port = 5;
  bool mqtt_tls = 6;
}
