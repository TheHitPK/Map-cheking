name: transmcbo
description: "TransMcbo: apps chofer y pasajero (flavors)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  core:
    path: packages/core
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_map: ^7.0.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/maracaibo.pmtiles
    - assets/certs/
