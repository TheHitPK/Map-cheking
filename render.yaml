# Render Blueprint (free plan): backend + Postgres. See DEPLOY.md.
services:
  - type: web
    name: asistencia-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: POSTGRES_HOST
        fromDatabase:
          name: asistencia-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: asistencia-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: asistencia-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: asistencia-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: asistencia-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      # Asked on the first deploy: password of the first supervisor (user "admin").
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: asistencia-db
    plan: free
    region: virginia
    databaseName: asistencia
    user: asistencia
    postgresMajorVersion: "16"
