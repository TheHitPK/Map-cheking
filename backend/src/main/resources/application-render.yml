# Render (free plan) + EMQX Serverless. Environment variables come from render.yaml / the Render dashboard.
server:
  port: ${PORT:10000}
  # Render's proxy terminates HTTPS; trust X-Forwarded-For so the PIN limiter sees the real client IP.
  forward-headers-strategy: native

spring:
  datasource:
    hikari:
      maximum-pool-size: 4
  data:
    redis:
      url: ${REDIS_URL}

transmcbo:
  routing:
    graph-dir: /app/graph-cache          # precompiled in the image (backend/Dockerfile)
    osm-file: /app/no-import.osm.pbf     # never import at runtime
  mqtt:
    host: ${MQTT_HOST}
    port: ${MQTT_PORT:8883}
    tls: true
    ssl-bundle: ""                       # EMQX Serverless has a public certificate: JVM trust store
    subscription: "v/#"                  # one instance: no shared subscription needed
  ingest:
    history-capacity: 5000
  auth:
    mode: password                       # EMQX Serverless has no JWT auth: fixed credentials per role
    jwt-secret: ${MQTT_JWT_SECRET}
    backend:
      username: ${MQTT_BACKEND_USER:backend}
      password: ${MQTT_BACKEND_PASSWORD}
    driver:
      username: ${MQTT_DRIVER_USER:chofer}
      password: ${MQTT_DRIVER_PASSWORD}
    passenger:
      username: ${MQTT_PASSENGER_USER:pasajero}
      password: ${MQTT_PASSENGER_PASSWORD}
    client-broker:                       # sent to the apps in every /auth token
      host: ${MQTT_HOST}
      port: ${MQTT_PORT:8883}
      tls: true

management:
  endpoint:
    health:
      show-details: never
