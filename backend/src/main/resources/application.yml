spring:
  application:
    name: asistencia-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:asistencia}
    username: ${POSTGRES_USER:asistencia}
    password: ${POSTGRES_PASSWORD:change-me}

server:
  compression:
    enabled: true
    mime-types: application/json,text/csv
    min-response-size: 1KB

asistencia:
  # Official time zone for shifts and daily reports.
  zone: ${APP_TIMEZONE:America/New_York}
  auth:
    # Dev default only; set JWT_SECRET in production.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-ttl: 12h
    bootstrap-admin:
      document: ${BOOTSTRAP_ADMIN_DOCUMENT:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  attendance:
    max-accuracy-meters: 50
    # A mark sent later than this after capture is accepted but flagged as deferred (offline).
    deferred-after: 2m
    # Capture times further than this in the future (device clock ahead) are rejected.
    max-clock-ahead: 2m
    # Marks queued offline for longer than this are rejected.
    max-deferral: 24h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        include: health
