spring:
  application:
    name: transmcbo-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:transmcbo}
    username: ${POSTGRES_USER:transmcbo}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  compression:
    enabled: true
    mime-types: application/x-protobuf
    min-response-size: 1KB

transmcbo:
  mqtt:
    host: ${MQTT_HOST:localhost}
    port: ${MQTT_PORT:1883}
  auth:
    # Shared with EMQX's JWT authenticator. Dev default only; set MQTT_JWT_SECRET in production.
    jwt-secret: ${MQTT_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-ttl: 1h
    backend-token-ttl: 24h
  ingest:
    history-capacity: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
