spring:
  application:
    name: transmcbo-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:transmcbo}
    username: ${POSTGRES_USER:transmcbo}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  compression:
    enabled: true
    mime-types: application/x-protobuf
    min-response-size: 1KB

transmcbo:
  mqtt:
    host: ${MQTT_HOST:localhost}
    port: ${MQTT_PORT:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  ingest:
    history-capacity: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
